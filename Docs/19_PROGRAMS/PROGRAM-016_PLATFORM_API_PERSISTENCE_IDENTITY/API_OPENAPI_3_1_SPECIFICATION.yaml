components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    resourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
    errorCode:
      name: errorCode
      in: path
      required: true
      schema:
        type: string
    consumerId:
      name: consumerId
      in: path
      required: true
      schema:
        type: string
    producerId:
      name: producerId
      in: path
      required: true
      schema:
        type: string
    principalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    permissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    responseId:
      name: responseId
      in: path
      required: true
      schema:
        type: string
    errorId:
      name: errorId
      in: path
      required: true
      schema:
        type: string
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
    operationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    batchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
    cursorId:
      name: cursorId
      in: path
      required: true
      schema:
        type: string
    scopeId:
      name: scopeId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ResourceDocument:
      type: object
      required: [id, resourceType, version, status, owner]
      properties:
        id:
          type: string
        resourceType:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        status:
          type: string
        owner:
          type: string
        tenantId:
          type: string
        scope:
          type: string
        lifecycle:
          type: string
        relations:
          type: array
          items:
            type: object
        metadata:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false

    CollectionResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDocument'
        count:
          type: integer
          minimum: 0
        nextCursor:
          type:
            - string
            - 'null'
      additionalProperties: false

    MutationRequest:
      type: object
      required: [correlationId, actor, intent, data]
      properties:
        correlationId:
          type: string
        idempotencyKey:
          type: string
        expectedVersion:
          type: string
        actor:
          type: object
          required: [id, type]
          properties:
            id:
              type: string
            type:
              type: string
        tenantId:
          type: string
        scope:
          type: string
        intent:
          type: string
        decisionId:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: false

    OperationAcceptance:
      type: object
      required: [operationId, status, correlationId]
      properties:
        operationId:
          type: string
        status:
          type: string
        resourceType:
          type: string
        correlationId:
          type: string
        message:
          type: string
      additionalProperties: false

    ApiError:
      type: object
      required: [code, category, message, cause]
      properties:
        code:
          type: string
        category:
          type: string
        message:
          type: string
        cause:
          type: string
        recommendedAction:
          type: string
        correlationId:
          type: string
        resourceReference:
          type: string
        version:
          type: string
      additionalProperties: false

  responses:
    ValidationError:
      description: Canonical validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr003:
              value:
                code: API-ERR-003
                category: Validation
                message: Request validation failed.
                cause: Payload, shape, type, or required field constraint violation.
                recommendedAction: Correct the request and retry.
    UnauthorizedError:
      description: Canonical authentication error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr001:
              value:
                code: API-ERR-001
                category: Authentication
                message: Authentication failed.
                cause: Missing, invalid, expired, or malformed identity proof.
                recommendedAction: Re-authenticate or renew credentials.
    ForbiddenError:
      description: Canonical authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr002:
              value:
                code: API-ERR-002
                category: Authorization
                message: Access denied.
                cause: Principal lacks required role, scope, tenant, or ownership rights.
                recommendedAction: Request the required permission or retry with an authorized principal.
    NotFoundError:
      description: Canonical not found error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr009:
              value:
                code: API-ERR-009
                category: Availability
                message: Service unavailable.
                cause: Target service or resource cannot currently serve the request.
                recommendedAction: Retry later or escalate if the condition persists.
    ConflictError:
      description: Canonical conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr004:
              value:
                code: API-ERR-004
                category: Conflict
                message: Resource conflict detected.
                cause: A resource state prevents the requested operation.
                recommendedAction: Refresh state and retry only after the conflict is resolved.
    PreconditionError:
      description: Canonical concurrency precondition error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr018:
              value:
                code: API-ERR-018
                category: Concurrency
                message: Conditional request failed.
                cause: ETag, version, or precondition did not match current state.
                recommendedAction: Refresh the resource and retry.
    DependencyMissingError:
      description: Canonical missing dependency error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr006:
              value:
                code: API-ERR-006
                category: Dependency
                message: Required dependency missing.
                cause: Upstream dependency or prerequisite is absent.
                recommendedAction: Resolve the dependency and retry.
    DependencyUnavailableError:
      description: Canonical unavailable dependency error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr007:
              value:
                code: API-ERR-007
                category: Dependency
                message: Required dependency unavailable.
                cause: Upstream dependency is unreachable, delayed, or invalidated.
                recommendedAction: Wait, re-evaluate dependency status, or escalate.
    RateLimitError:
      description: Canonical rate limit error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr008:
              value:
                code: API-ERR-008
                category: Rate Limit
                message: Rate limit exceeded.
                cause: Client has exceeded allowed request volume.
                recommendedAction: Back off and retry after the indicated window.
    IdempotencyConflictError:
      description: Canonical idempotency conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr012:
              value:
                code: API-ERR-012
                category: Conflict
                message: Idempotency conflict.
                cause: The same idempotency key is associated with a different logical request.
                recommendedAction: Use a new idempotency key and verify request intent.
    FilterNotSupportedError:
      description: Canonical unsupported filter error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr015:
              value:
                code: API-ERR-015
                category: Validation
                message: Filter not supported.
                cause: Filter dimension or operator is not declared by the contract.
                recommendedAction: Remove unsupported filters or use supported query dimensions.
    SortNotSupportedError:
      description: Canonical unsupported sort error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr016:
              value:
                code: API-ERR-016
                category: Validation
                message: Sort not supported.
                cause: Sort key or order is not declared by the contract.
                recommendedAction: Use a declared sort key or remove sorting.
    WebhookDeliveryFailedError:
      description: Canonical webhook delivery failure error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr017:
              value:
                code: API-ERR-017
                category: Dependency
                message: Webhook delivery failed.
                cause: Subscriber endpoint cannot be reached or rejected the callback.
                recommendedAction: Retry delivery or re-register the subscription.
    PrincipalNotRecognizedError:
      description: Canonical principal recognition error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr019:
              value:
                code: API-ERR-019
                category: Authentication
                message: Principal not recognized.
                cause: The identity source did not resolve to a canonical principal.
                recommendedAction: Re-authenticate or correct the identity provider mapping.
    ScopeViolationError:
      description: Canonical scope violation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr020:
              value:
                code: API-ERR-020
                category: Authorization
                message: Scope violation.
                cause: The requested scope exceeds what the principal is allowed to access.
                recommendedAction: Reduce scope or request delegated access.
    InternalError:
      description: Canonical internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            apiErr013:
              value:
                code: API-ERR-013
                category: Internal
                message: Internal error.
                cause: Unclassified server-side failure.
                recommendedAction: Retry if appropriate; escalate if persistent.
